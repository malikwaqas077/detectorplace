<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="plotly.min.js"></script>
<style>html, body {margin: 0; padding: 0; background: transparent; font-family: sans-serif;} #plot {width: 100%;}</style>
</head>
<body>
<div id="plot"></div>
<script>
// Minimal Streamlit component (v1 message protocol): draws a Plotly figure and reports clicked points.
function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*");
}
const el = document.getElementById("plot");
let lastFig = null, bound = false;

window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (!msg || msg.type !== "streamlit:render") return;
  const args = msg.args || {};
  const height = args.height || 600;
  if (args.fig !== lastFig) {
    lastFig = args.fig;
    const fig = JSON.parse(args.fig);
    fig.layout = fig.layout || {};
    fig.layout.height = height;
    fig.layout.autosize = true;
    Plotly.react(el, fig.data, fig.layout, {displaylogo: false, responsive: true});
    if (!bound) {
      bound = true;
      el.on("plotly_click", (e) => {
        const pt = e && e.points && e.points[0];
        if (!pt) return;
        const tag = Array.isArray(pt.text) ? pt.text[0] : pt.text;
        send("streamlit:setComponentValue", {
          value: {tag: tag || null, trace: pt.data ? pt.data.name : null, x: pt.x, y: pt.y, z: pt.z, nonce: Date.now()},
          dataType: "json"
        });
      });
    }
  }
  send("streamlit:setFrameHeight", {height: height + 4});
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
